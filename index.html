<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAKU Invoice Pro - Generator Invoice Profesional</title>
    <!-- Tailwind CSS untuk Desain Premium -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Google Font: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- React & Babel CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Library PDF HTML2PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        /* Gaya Cetak Khusus agar Presisi A4 Landscape */
        @media print {
            body {
                background: white;
                margin: 0;
                padding: 0;
            }
            .no-print {
                display: none !important;
            }
            .print-exact {
                box-shadow: none !important;
                border: none !important;
                padding: 0 !important;
                margin: 0 !important;
                width: 297mm !important;
                height: 210mm !important;
                transform: none !important;
            }
        }
        
        /* Maksimalkan Transisi Halus */
        .smooth-transition {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Nonaktifkan spinner input number */
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }

        /* Force unscale saat konversi PDF sedang berlangsung */
        .pdf-mode {
            transform: none !important;
            margin-bottom: 0 !important;
            width: 1122px !important; /* 297mm @96DPI */
            height: 794px !important;  /* 210mm @96DPI */
            border-radius: 0 !important;
            box-shadow: none !important;
            border: none !important;
        }
        
        /* Desain Scrollbar Minimalis untuk panel editor */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">
    <div id="root" class="flex-grow flex flex-col"></div>

    <script type="text/babel">
        // --- TEMPELKAN URL GOOGLE APPS SCRIPT WEB APP ANDA DI BAWAH INI ---
        const gasUrl = 'https://script.google.com/macros/s/AKfycbwA4sfNiqLEwWGBSsyqvZUf3PXoGB2ot7hBAWpXiuxkXNG7VzvfKgKClehxj04Q2r_BDg/exec'; 

        // Custom SVG Icons
        const Icons = {
            Logo: () => <svg className="w-8 h-8 text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5"><path strokeLinecap="round" strokeLinejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>,
            User: () => <svg className="w-5 h-5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>,
            Lock: () => <svg className="w-5 h-5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg>,
            Mail: () => <svg className="w-5 h-5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>,
            Add: () => <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="3"><path strokeLinecap="round" strokeLinejoin="round" d="M12 4v16m8-8H4" /></svg>,
            Trash: () => <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>,
            Download: () => <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5"><path strokeLinecap="round" strokeLinejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>,
            WA: () => <svg className="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946C.06 5.348 5.397.01 12.008 0c3.202.001 6.212 1.247 8.477 3.514 2.266 2.268 3.507 5.28 3.505 8.484-.004 6.657-5.34 11.997-11.953 11.997-2.005-.001-3.973-.503-5.727-1.46L0 24zm6.59-4.846c1.6.95 3.188 1.449 4.825 1.451 5.436 0 9.86-4.37 9.864-9.799.002-2.63-1.023-5.101-2.885-6.963C16.528 2.025 14.072 1 11.516 1c-5.44 0-9.865 4.369-9.87 9.8a9.66 9.66 0 001.493 5.15l-.975 3.565 3.654-.947c1.644.897 3.253 1.362 4.729 1.362z" /></svg>,
            Logout: () => <svg className="w-5 h-5 text-rose-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>,
            New: () => <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M12 9v3m0 0v3m0-3h3m-3 0H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>,
            Save: () => <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5"><path strokeLinecap="round" strokeLinejoin="round" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 002-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4" /></svg>,
            CloudUpload: () => <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5"><path strokeLinecap="round" strokeLinejoin="round" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z" /><path strokeLinecap="round" strokeLinejoin="round" d="M12 12V4m0 0l-3 3m3-3l3 3" /></svg>
        };

        const EditableInput = ({ value, onChange, className = "", type = "text", multiline = false, placeholder = "" }) => {
            const baseClasses = `w-full bg-transparent border border-transparent hover:border-slate-300 focus:border-indigo-500 focus:bg-indigo-50/50 rounded px-1.5 py-0.5 outline-none smooth-transition placeholder-slate-300 print:hidden [.pdf-mode_&]:hidden ${className}`;
            const displayClasses = `hidden print:block [.pdf-mode_&]:block whitespace-pre-wrap break-words w-full px-1.5 py-0.5 ${className}`;
            
            if (multiline) {
                return (
                    <div className="w-full relative">
                        <textarea
                            value={value}
                            onChange={(e) => {
                                e.target.style.height = 'auto';
                                e.target.style.height = e.target.scrollHeight + 'px';
                                onChange(e.target.value);
                            }}
                            ref={(el) => {
                                if (el) {
                                    el.style.height = 'auto';
                                    el.style.height = el.scrollHeight + 'px';
                                }
                            }}
                            placeholder={placeholder}
                            className={`${baseClasses} resize-none overflow-hidden`}
                        />
                        <div className={displayClasses}>
                            {value || <span className="text-slate-400 italic">{placeholder}</span>}
                        </div>
                    </div>
                );
            }
            
            return (
                <div className="w-full relative">
                    <input
                        type={type}
                        value={value}
                        onChange={(e) => onChange(e.target.value)}
                        placeholder={placeholder}
                        className={baseClasses}
                    />
                    <div className={displayClasses}>
                        {value || <span className="text-slate-400 italic">{placeholder}</span>}
                    </div>
                </div>
            );
        };

        function AuthScreen({ onLogin }) {
            const [isLogin, setIsLogin] = React.useState(true);
            const [email, setEmail] = React.useState('');
            const [password, setPassword] = React.useState('');
            const [name, setName] = React.useState('');
            const [loading, setLoading] = React.useState(false);
            const [message, setMessage] = React.useState({ type: '', text: '' });

            const handleSubmit = async (e) => {
                e.preventDefault();
                setLoading(true);
                setMessage({ type: '', text: '' });

                if (!gasUrl) {
                    setTimeout(() => {
                        onLogin({ name: isLogin ? 'User Demo' : name, email: email }, "demo_token_12345");
                    }, 1000);
                    return;
                }

                try {
                    const response = await fetch(gasUrl, {
                        method: 'POST',
                        body: JSON.stringify({
                            action: isLogin ? 'login' : 'register',
                            email, password, name
                        })
                    });
                    const result = await response.json();
                    if (result.status === 'success') {
                        setMessage({ type: 'success', text: result.message });
                        setTimeout(() => onLogin(result.user, result.token, result.profile), 1500);
                    } else {
                        setMessage({ type: 'error', text: result.message });
                    }
                } catch (err) {
                    setMessage({ type: 'error', text: 'Gagal terhubung ke Database. Silakan cek ulang GAS URL atau jalankan offline.' });
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="min-h-screen flex items-center justify-center bg-slate-100 p-4">
                    <div className="bg-white p-6 md:p-8 rounded-3xl shadow-xl w-full max-w-md border border-slate-200/80 relative overflow-hidden">
                        <div className="absolute top-0 left-0 w-full h-2 bg-indigo-600"></div>
                        
                        <div className="text-center mb-6">
                            <div className="bg-indigo-50 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4 border border-indigo-100">
                                <Icons.Logo />
                            </div>
                            <h2 className="text-2xl font-black text-slate-900 tracking-tight">RAKU Invoice Pro</h2>
                            <p className="text-slate-500 text-sm mt-1">Sistem invoicing instan dengan cloud backend</p>
                        </div>

                        {message.text && (
                            <div className={`p-3 mb-4 rounded-xl text-xs font-semibold flex items-center gap-2 ${message.type === 'success' ? 'bg-emerald-50 text-emerald-700' : 'bg-rose-50 text-rose-700'}`}>
                                <div className="w-1.5 h-1.5 rounded-full bg-current"></div>
                                {message.text}
                            </div>
                        )}

                        <form onSubmit={handleSubmit} className="space-y-4">
                            {!isLogin && (
                                <div className="relative">
                                    <div className="absolute left-3.5 top-3.5"><Icons.User /></div>
                                    <input type="text" placeholder="Nama Lengkap" required value={name} onChange={(e) => setName(e.target.value)} className="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none text-sm focus:border-indigo-500 focus:bg-white transition-all placeholder-slate-400 font-medium" />
                                </div>
                            )}
                            <div className="relative">
                                <div className="absolute left-3.5 top-3.5"><Icons.Mail /></div>
                                <input type="email" placeholder="Alamat Email" required value={email} onChange={(e) => setEmail(e.target.value)} className="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none text-sm focus:border-indigo-500 focus:bg-white transition-all placeholder-slate-400 font-medium" />
                            </div>
                            <div className="relative">
                                <div className="absolute left-3.5 top-3.5"><Icons.Lock /></div>
                                <input type="password" placeholder="Kata Sandi" required value={password} onChange={(e) => setPassword(e.target.value)} className="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none text-sm focus:border-indigo-500 focus:bg-white transition-all placeholder-slate-400 font-medium" />
                            </div>

                            <button type="submit" disabled={loading} className="w-full bg-slate-900 text-white font-bold py-3 rounded-xl hover:bg-slate-800 transition-all flex items-center justify-center gap-2 shadow-lg shadow-slate-900/10">
                                {loading ? (
                                    <span className="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
                                ) : (
                                    isLogin ? 'Masuk Sekarang' : 'Daftar Akun Baru'
                                )}
                            </button>
                        </form>

                        <div className="mt-6 text-center">
                            <button onClick={() => { setIsLogin(!isLogin); setMessage({ type: '', text: '' }); }} className="text-sm font-semibold text-indigo-600 hover:text-indigo-800 transition-colors">
                                {isLogin ? 'Belum punya akun? Daftar gratis' : 'Sudah punya akun? Masuk'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function App() {
            const [user, setUser] = React.useState(null);
            const [token, setToken] = React.useState(null);
            const [checkingAuth, setCheckingAuth] = React.useState(true);

            // Responsive Layout State
            const [activeTab, setActiveTab] = React.useState('editor'); // 'editor' atau 'preview' (Untuk Mobile View)
            const [scale, setScale] = React.useState(1);
            const previewContainerRef = React.useRef(null);

            // State Data Toko & Catatan Default
            const [storeInfo, setStoreInfo] = React.useState({
                name: '', address: '', phone: '', email: '', logo: ''
            });

            const [customerInfo, setCustomerInfo] = React.useState({ name: '', address: '', email: '', phone: '' });
            const [invoiceMeta, setInvoiceMeta] = React.useState({
                number: '',
                date: new Date().toISOString().split('T')[0],
                dueDate: new Date(new Date().setDate(new Date().getDate() + 14)).toISOString().split('T')[0]
            });

            const [items, setItems] = React.useState([{ id: 1, name: '', quantity: 1, price: 0 }]);
            const [financials, setFinancials] = React.useState({ taxRate: 11, discount: 0, downPayment: 0 });
            const [notes, setNotes] = React.useState('');
            const [themeColor, setThemeColor] = React.useState('#4f46e5'); // Indigo Default

            // Status Operasional & Riwayat
            const [isGenerating, setIsGenerating] = React.useState(false);
            const [isSaving, setIsSaving] = React.useState(false);
            const [isSavingInvoice, setIsSavingInvoice] = React.useState(false);
            const [invoicesHistory, setInvoicesHistory] = React.useState([]);
            const [isLoadingHistory, setIsLoadingHistory] = React.useState(false);
            const [alertModal, setAlertModal] = React.useState({ show: false, message: '', type: 'success', onConfirm: null });

            const fileInputRef = React.useRef(null);

            React.useEffect(() => {
                const handleResize = () => {
                    if (!previewContainerRef.current || isGenerating) return;
                    const parentWidth = previewContainerRef.current.clientWidth;
                    const targetWidth = 1122; // Lebar standar kertas A4 Landscape (297mm) dalam Pixel
                    if (parentWidth < targetWidth) {
                        setScale(parentWidth / targetWidth);
                    } else {
                        setScale(1);
                    }
                };

                window.addEventListener('resize', handleResize);
                // Jalankan setelah DOM siap
                const timer = setTimeout(handleResize, 100);
                
                return () => {
                    window.removeEventListener('resize', handleResize);
                    clearTimeout(timer);
                };
            }, [activeTab, user, isGenerating]); // Pemicu render ulang skala saat ganti tab / login / cetak PDF

            React.useEffect(() => {
                const autoLoginWithToken = async () => {
                    const savedToken = localStorage.getItem('raku_token');
                    const savedUser = localStorage.getItem('raku_user');

                    if (savedToken && savedUser) {
                        const parsedUser = JSON.parse(savedUser);
                        if (!gasUrl) {
                            setUser(parsedUser);
                            setToken(savedToken);
                            loadLocalDemoData();
                            fetchInvoicesHistory(null);
                            setCheckingAuth(false);
                            return;
                        }

                        try {
                            const response = await fetch(gasUrl, {
                                method: 'POST',
                                body: JSON.stringify({ action: 'validateToken', token: savedToken })
                            });
                            const result = await response.json();
                            if (result.status === 'success') {
                                setUser(result.user);
                                setToken(savedToken);
                                
                                if (result.profile) {
                                    applyProfileData(result.profile);
                                } else {
                                    setItems([{ id: Date.now(), name: '', quantity: 1, price: 0 }]);
                                    generateNewInvoiceNum();
                                }
                                fetchInvoicesHistory(savedToken);
                            } else {
                                localStorage.removeItem('raku_token');
                                localStorage.removeItem('raku_user');
                            }
                        } catch (err) {
                            setUser(parsedUser);
                            setToken(savedToken);
                            loadLocalDemoData();
                            fetchInvoicesHistory(null);
                        }
                    }
                    setCheckingAuth(false);
                };

                autoLoginWithToken();
            }, []);

            const loadLocalDemoData = () => {
                setStoreInfo({
                    name: 'RAKU Studio & Co.',
                    address: 'Grand Surapati Core Blok B-10, Bandung\nJawa Barat, Indonesia 40192',
                    phone: '+62 822-1234-5678',
                    email: 'finance@raku.co.id',
                    logo: ''
                });
                setCustomerInfo({
                    name: 'PT Sukses Bersama Mandiri',
                    address: 'Menara Sudirman Lantai 12, Jakarta Selatan',
                    email: 'info@suksesbersama.com',
                    phone: '0811999888'
                });
                setInvoiceMeta({
                    number: 'INV/' + new Date().getFullYear() + '/001',
                    date: new Date().toISOString().split('T')[0],
                    dueDate: new Date(new Date().setDate(new Date().getDate() + 14)).toISOString().split('T')[0]
                });
                setItems([
                    { id: 1, name: 'Analisa Bisnis & Perancangan System Flowchart', quantity: 1, price: 1200000 },
                    { id: 2, name: 'Pengembangan Desain UI/UX & Web Prototype Figma', quantity: 1, price: 2500000 },
                    { id: 3, name: 'Instalasi Framework Backend & Setup API Services', quantity: 1, price: 3000000 },
                    { id: 4, name: 'Slicing UI Frontend Component dengan Tailwind CSS', quantity: 1, price: 2000000 },
                    { id: 5, name: 'Integrasi Keamanan Otentikasi JWT & Role Base', quantity: 1, price: 1500000 }
                ]);
                setFinancials({ taxRate: 11, discount: 0, downPayment: 5000000 });
                setNotes('Transfer Pembayaran:\nBank Mandiri: 131-00-1234567-8\na.n. RAKU Studio & Co.');
            };

            const generateNewInvoiceNum = () => {
                setInvoiceMeta(prev => ({
                    ...prev,
                    number: 'INV/' + new Date().getFullYear() + '/' + String(Math.floor(Math.random() * 900) + 100)
                }));
            };

            const applyProfileData = (p) => {
                setStoreInfo({
                    name: p.name || '',
                    address: p.address || '',
                    phone: p.phone || '',
                    email: p.email || '',
                    logo: p.logo || ''
                });
                if (p.notes) setNotes(p.notes);
                if (p.themeColor) setThemeColor(p.themeColor);
                setItems([{ id: Date.now(), name: '', quantity: 1, price: 0 }]);
                generateNewInvoiceNum();
            };

            const fetchInvoicesHistory = async (activeToken) => {
                setIsLoadingHistory(true);
                const currentToken = activeToken || token;

                if (!gasUrl || !currentToken) {
                    const localHistory = JSON.parse(localStorage.getItem('raku_local_invoices') || '[]');
                    setInvoicesHistory(localHistory);
                    setIsLoadingHistory(false);
                    return;
                }

                try {
                    const response = await fetch(gasUrl, {
                        method: 'POST',
                        body: JSON.stringify({
                            action: 'getInvoices',
                            token: currentToken
                        })
                    });
                    const result = await response.json();
                    if (result.status === 'success') {
                        setInvoicesHistory(result.invoices || []);
                    }
                } catch (err) {
                    console.error("Gagal memuat riwayat invoice dari Cloud.", err);
                } finally {
                    setIsLoadingHistory(false);
                }
            };

            const handleLoginSuccess = (userData, userToken, profileData) => {
                setUser(userData);
                setToken(userToken);
                localStorage.setItem('raku_user', JSON.stringify(userData));
                localStorage.setItem('raku_token', userToken);

                if (profileData) {
                    applyProfileData(profileData);
                } else {
                    setItems([{ id: Date.now(), name: '', quantity: 1, price: 0 }]);
                    generateNewInvoiceNum();
                    setFinancials({ taxRate: 11, discount: 0, downPayment: 0 });
                }
                fetchInvoicesHistory(userToken);
            };

            const subtotal = items.reduce((acc, item) => acc + (Number(item.quantity) || 0) * (Number(item.price) || 0), 0);
            const taxAmount = subtotal * ((Number(financials.taxRate) || 0) / 100);
            const total = subtotal + taxAmount - (Number(financials.discount) || 0);
            const downPayment = Number(financials.downPayment) || 0;
            const remainingBalance = total - downPayment;
            const isPaidOff = remainingBalance <= 0;

            const formatIDR = (val) => {
                return new Intl.NumberFormat('id-ID', {
                    style: 'currency',
                    currency: 'IDR',
                    minimumFractionDigits: 0,
                    maximumFractionDigits: 0
                }).format(val);
            };

            const handleItemChange = (id, field, value) => {
                setItems(items.map(item => {
                    if (item.id === id) {
                        return { ...item, [field]: field === 'name' ? value : Number(value) };
                    }
                    return item;
                }));
            };

            const addNewItemRow = () => {
                if (items.length >= 20) {
                    showAlert('Demi kestabilan cetak 1 halaman A4, batas maksimal rincian adalah 20 baris.', 'error');
                    return;
                }
                setItems([...items, { id: Date.now(), name: '', quantity: 1, price: 0 }]);
            };

            const removeItemRow = (id) => {
                if (items.length > 1) {
                    setItems(items.filter(item => item.id !== id));
                } else {
                    showAlert('Minimal harus menyisakan satu rincian transaksi.', 'error');
                }
            };

            const handleLogoUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        const img = new Image();
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            const MAX_WIDTH = 150;
                            const scaleSize = MAX_WIDTH / img.width;
                            canvas.width = MAX_WIDTH;
                            canvas.height = img.height * scaleSize;
                            
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                            const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);
                            setStoreInfo(prev => ({ ...prev, logo: compressedBase64 }));
                        };
                        img.src = event.target.result;
                    };
                    reader.readAsDataURL(file);
                }
            };

            const handleSaveProfileCloud = async () => {
                setIsSaving(true);
                if (!gasUrl) {
                    showAlert('Anda sedang dalam Mode Offline. Silakan pasang GAS URL untuk menyimpan ke Cloud.', 'error');
                    setIsSaving(false);
                    return;
                }

                try {
                    const response = await fetch(gasUrl, {
                        method: 'POST',
                        body: JSON.stringify({
                            action: 'saveProfile',
                            token: token,
                            storeName: storeInfo.name,
                            address: storeInfo.address,
                            phone: storeInfo.phone,
                            storeEmail: storeInfo.email,
                            logo: storeInfo.logo,
                            themeColor: themeColor,
                            notes: notes
                        })
                    });
                    const result = await response.json();
                    if (result.status === 'success') {
                        showAlert('Profil Toko, Logo, Kontak, dan Setelan Rekening berhasil dicadangkan ke Database Cloud!', 'success');
                    } else {
                        showAlert('Gagal mencadangkan profil: ' + result.message, 'error');
                    }
                } catch (err) {
                    showAlert('Koneksi terputus. Pastikan konfigurasi internet Anda stabil.', 'error');
                } finally {
                    setIsSaving(false);
                }
            };

            const handleSaveInvoiceCloud = async () => {
                if (!invoiceMeta.number) {
                    showAlert('Nomor invoice tidak boleh kosong untuk disimpan.', 'error');
                    return;
                }

                setIsSavingInvoice(true);

                const invoiceDataPayload = {
                    invoiceNumber: invoiceMeta.number,
                    invoiceDate: invoiceMeta.date,
                    dueDate: invoiceMeta.dueDate,
                    customerName: customerInfo.name,
                    customerAddress: customerInfo.address,
                    customerEmail: customerInfo.email,
                    customerPhone: customerInfo.phone,
                    items: JSON.stringify(items),
                    taxRate: financials.taxRate,
                    discount: financials.discount,
                    downPayment: financials.downPayment,
                    notes: notes,
                    total: total,
                    themeColor: themeColor
                };

                if (!gasUrl) {
                    // Mode Demo: Save to Local Storage Riwayat
                    const localHistory = JSON.parse(localStorage.getItem('raku_local_invoices') || '[]');
                    const existingIndex = localHistory.findIndex(inv => inv.invoiceNumber === invoiceMeta.number);
                    
                    if (existingIndex !== -1) {
                        localHistory[existingIndex] = invoiceDataPayload;
                    } else {
                        localHistory.push(invoiceDataPayload);
                    }
                    
                    localStorage.setItem('raku_local_invoices', JSON.stringify(localHistory));
                    setInvoicesHistory(localHistory);
                    showAlert('Invoice berhasil disimpan ke Riwayat Lokal (Mode Offline).', 'success');
                    setIsSavingInvoice(false);
                    return;
                }

                try {
                    const response = await fetch(gasUrl, {
                        method: 'POST',
                        body: JSON.stringify({
                            action: 'saveInvoice',
                            token: token,
                            ...invoiceDataPayload
                        })
                    });
                    const result = await response.json();
                    if (result.status === 'success') {
                        showAlert('Invoice ini berhasil tersimpan/diperbarui di Riwayat Database Cloud!', 'success');
                        fetchInvoicesHistory();
                    } else {
                        showAlert('Gagal menyimpan invoice: ' + result.message, 'error');
                    }
                } catch (err) {
                    showAlert('Gagal menghubungkan ke Server Cloud. Pastikan koneksi internet stabil.', 'error');
                } finally {
                    setIsSavingInvoice(false);
                }
            };

            const handleLoadInvoice = (inv) => {
                setInvoiceMeta({
                    number: inv.invoiceNumber,
                    date: inv.invoiceDate,
                    dueDate: inv.dueDate
                });
                setCustomerInfo({
                    name: inv.customerName,
                    address: inv.customerAddress,
                    email: inv.customerEmail,
                    phone: inv.customerPhone
                });
                try {
                    setItems(JSON.parse(inv.items));
                } catch (e) {
                    setItems([{ id: Date.now(), name: inv.items || '', quantity: 1, price: 0 }]);
                }
                setFinancials({
                    taxRate: Number(inv.taxRate) || 0,
                    discount: Number(inv.discount) || 0,
                    downPayment: Number(inv.downPayment) || 0
                });
                if (inv.notes) setNotes(inv.notes);
                if (inv.themeColor) setThemeColor(inv.themeColor);
                
                showAlert(`Invoice ${inv.invoiceNumber} berhasil dimuat kembali ke lembar kerja.`, 'success');
            };

            const handleDeleteInvoice = async (invoiceNumber) => {
                setAlertModal({
                    show: true,
                    type: 'confirm',
                    message: `Apakah Anda yakin ingin menghapus Invoice ${invoiceNumber} dari riwayat database?`,
                    onConfirm: async () => {
                        setAlertModal({ show: false, message: '', type: 'success' });
                        
                        if (!gasUrl) {
                            const localHistory = JSON.parse(localStorage.getItem('raku_local_invoices') || '[]');
                            const filtered = localHistory.filter(inv => inv.invoiceNumber !== invoiceNumber);
                            localStorage.setItem('raku_local_invoices', JSON.stringify(filtered));
                            setInvoicesHistory(filtered);
                            showAlert('Invoice berhasil dihapus dari Riwayat Lokal.', 'success');
                            return;
                        }

                        try {
                            const response = await fetch(gasUrl, {
                                method: 'POST',
                                body: JSON.stringify({
                                    action: 'deleteInvoice',
                                    token: token,
                                    invoiceNumber: invoiceNumber
                                })
                            });
                            const result = await response.json();
                            if (result.status === 'success') {
                                showAlert('Invoice berhasil dihapus dari database cloud.', 'success');
                                fetchInvoicesHistory();
                            } else {
                                showAlert('Gagal menghapus: ' + result.message, 'error');
                            }
                        } catch (err) {
                            showAlert('Terjadi kesalahan koneksi saat menghapus.', 'error');
                        }
                    }
                });
            };

            const triggerNewInvoice = () => {
                setAlertModal({
                    show: true,
                    type: 'confirm',
                    message: 'Ingin membuat invoice baru? Seluruh data rincian transaksi dan informasi klien saat ini akan dibersihkan (Profil toko Anda tetap aman).',
                    onConfirm: () => {
                        setCustomerInfo({ name: '', address: '', email: '', phone: '' });
                        setItems([{ id: Date.now(), name: '', quantity: 1, price: 0 }]);
                        generateNewInvoiceNum();
                        setFinancials({ taxRate: 11, discount: 0, downPayment: 0 });
                        setAlertModal({ show: false, message: '', type: 'success' });
                    }
                });
            };

            const showAlert = (msg, type = 'success', onConf = null) => {
                setAlertModal({ show: true, message: msg, type, onConfirm: onConf });
            };

            const handleDownloadPDF = () => {
                setIsGenerating(true);
                
                // Beri jeda 300ms agar React selesai merender ulang elemen ke Skala Asli 1:1
                setTimeout(() => {
                    const element = document.getElementById('raku-invoice-document');
                    element.classList.add('pdf-mode');

                    const opt = {
                        filename: `${invoiceMeta.number.replace(/\//g, '-')}.pdf`,
                        image: { type: 'jpeg', quality: 1.0 },
                        html2canvas: { 
                            scale: 2, // Resolusi cetak tajam (DPI Tinggi)
                            useCORS: true, 
                            letterRendering: true,
                            scrollX: 0, // Kunci koordinat X agar tidak tergeser scrollbar
                            scrollY: 0, // Kunci koordinat Y agar tidak tergeser scrollbar
                            windowWidth: 1122, // Samakan lebar tangkapan dengan ukuran kertas landscape
                            windowHeight: 794  // Samakan tinggi tangkapan dengan ukuran kertas landscape
                        },
                        jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' }
                    };

                    html2pdf().set(opt).from(element).save().then(() => {
                        element.classList.remove('pdf-mode');
                        setIsGenerating(false);
                    }).catch((err) => {
                        console.error("PDF Render Error: ", err);
                        element.classList.remove('pdf-mode');
                        setIsGenerating(false);
                        showAlert('Gagal mendownload PDF. Silakan ulangi.', 'error');
                    });
                }, 300);
            };

            const handleSendWhatsApp = () => {
                const statusLunas = isPaidOff ? '*LUNAS*' : `*Sisa Tagihan:* ${formatIDR(remainingBalance)}`;
                const text = `Halo *${customerInfo.name || 'Pelanggan'}*,\n\nBerikut ringkasan rincian invoice Anda dari *${storeInfo.name || 'Kami'}*:\n\n*No. Invoice:* ${invoiceMeta.number}\n*Tanggal:* ${invoiceMeta.date}\n*Total Tagihan:* ${formatIDR(total)}\n*Uang Muka / DP:* ${formatIDR(downPayment)}\n${statusLunas}\n\nTerima kasih atas kepercayaan Anda.`;
                const link = `https://wa.me/${customerInfo.phone || ''}?text=${encodeURIComponent(text)}`;
                window.open(link, '_blank');
            };

            const handleLogout = () => {
                localStorage.removeItem('raku_token');
                localStorage.removeItem('raku_user');

                setToken(null);
                setInvoicesHistory([]);

                return (
                    <div className="min-h-screen flex flex-col items-center justify-center bg-slate-50">

            return (

                    {/* --- HEADER CONTROLS (Hidden in Print) --- */}
                    <header className="sticky top-0 bg-white border-b border-slate-200 shadow-sm z-30 no-print">
                        <div className="max-w-7xl mx-auto px-4 py-3 flex flex-col md:flex-row gap-4 items-center justify-between">

                                <div>

                                    <p className="text-[10px] text-slate-500 font-semibold truncate max-w-[200px] md:max-w-xs">User: {user.name}</p>

                                    <button

                                        style={{ backgroundColor: color }}

                            </div>

                            {/* Tombol Aksi Cepat */}
                            <div className="flex flex-wrap items-center gap-2 w-full md:w-auto justify-end">

                                    <Icons.New /> <span className="hidden sm:inline">Invoice Baru</span>
                                </button>
                                <button onClick={handleSaveInvoiceCloud} disabled={isSavingInvoice} className="px-3 py-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 rounded-xl text-xs font-bold flex items-center gap-1.5 smooth-transition shadow-sm border border-indigo-200">
                                    {isSavingInvoice ? <span className="w-4 h-4 border-2 border-indigo-500 border-t-indigo-500 rounded-full animate-spin"></span> : <Icons.CloudUpload />}
                                    {isSavingInvoice ? 'Menyimpan...' : 'Simpan Invoice'}
                                </button>
                                <button onClick={handleSaveProfileCloud} disabled={isSaving} className="px-3 py-2 bg-slate-800 hover:bg-slate-900 text-white rounded-xl text-xs font-bold flex items-center gap-1.5 smooth-transition shadow-sm">
                                    {isSaving ? <span className="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span> : <Icons.Save />}
                                    {isSaving ? 'Menyimpan...' : 'Simpan Profil'}
                                </button>
                                <button onClick={handleSendWhatsApp} className="px-3 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold flex items-center gap-1.5 smooth-transition shadow-md">
                                    <Icons.WA /> Kirim WA
                                </button>
                                <button onClick={handleDownloadPDF} disabled={isGenerating} className="px-4 py-2 text-white rounded-xl text-xs font-bold flex items-center gap-2 smooth-transition shadow-md" style={{ backgroundColor: themeColor }}>
                                    {isGenerating ? (
                                        <span className="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
                                    ) : (
                                        <Icons.Download />
                                    )}
                                    {isGenerating ? 'Memproses...' : 'Download PDF'}
                                </button>
                                <button onClick={handleLogout} className="p-2 hover:bg-rose-50 rounded-xl smooth-transition" title="Keluar">
                                    <Icons.Logout />
                                </button>
                            </div>
                        </div>

                        {/* TAB BAR KHUSUS HP (Mobile Only) */}
                        <div className="flex border-t border-slate-200 lg:hidden">
                            <button 
                                onClick={() => setActiveTab('editor')}
                                className={`flex-1 py-3 text-center text-xs font-bold border-b-2 smooth-transition ${activeTab === 'editor' ? 'border-indigo-600 text-indigo-600 bg-indigo-50/20' : 'border-transparent text-slate-500'}`}
                            >
                                ✏️ Isi Data
                            </button>
                            <button 
                                onClick={() => setActiveTab('preview')}
                                className={`flex-1 py-3 text-center text-xs font-bold border-b-2 smooth-transition ${activeTab === 'preview' ? 'border-indigo-600 text-indigo-600 bg-indigo-50/20' : 'border-transparent text-slate-500'}`}
                            >
                                👁️ Pratinjau PDF
                            </button>
                        </div>
                    </header>

                    {/* --- LAYOUT UTAMA --- */}
                    <main className="flex-grow max-w-7xl w-full mx-auto p-4 flex flex-col lg:flex-row gap-6">

                        {/* PANEL EDIT DATA (Akordeon Input - Tampil di Kiri pada Laptop, Aktif di Tab Editor pada HP) */}
                        <section className={`w-full lg:w-[35%] flex flex-col gap-4 ${activeTab === 'editor' ? 'block' : 'hidden lg:block'}`}>
                            
                            {/* Riwayat Invoice Cloud Card */}
                            <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm max-h-[350px] flex flex-col">
                                <h3 className="text-xs font-bold uppercase tracking-wider text-slate-400 mb-3 flex items-center justify-between shrink-0">
                                    <span className="flex items-center gap-2">
                                        <span className="w-1.5 h-1.5 rounded-full" style={{ backgroundColor: themeColor }}></span>
                                        Riwayat Invoice Saved
                                    </span>
                                    <span className="text-[10px] bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full font-bold">
                                        {invoicesHistory.length} Saved
                                    </span>
                                </h3>

                                <div className="flex-grow overflow-y-auto space-y-2 pr-1">
                                    {isLoadingHistory ? (
                                        <div className="py-6 text-center text-xs font-semibold text-slate-400 flex flex-col items-center gap-2">
                                            <span className="w-6 h-6 border-2 border-slate-300 border-t-indigo-600 rounded-full animate-spin"></span>
                                            Memuat riwayat...
                                        </div>
                                    ) : invoicesHistory.length === 0 ? (
                                        <div className="py-6 text-center text-xs font-medium text-slate-400 italic">
                                            Belum ada riwayat invoice yang disimpan.
                                        </div>
                                    ) : (
                                        invoicesHistory.map((inv) => (
                                            <div key={inv.invoiceNumber} className="p-3 bg-slate-50 rounded-xl border border-slate-200/60 flex items-center justify-between gap-2 hover:border-indigo-200 smooth-transition">
                                                <div className="min-w-0 flex-1">
                                                    <h4 className="text-xs font-bold text-slate-800 truncate">{inv.invoiceNumber}</h4>
                                                    <p className="text-[10px] text-slate-500 font-semibold truncate mt-0.5">Klien: {inv.customerName || 'N/A'}</p>
                                                    <p className="text-[9px] text-slate-400 font-bold mt-0.5">{inv.invoiceDate} • {formatIDR(inv.total)}</p>
                                                </div>
                                                <div className="flex items-center gap-1 shrink-0">
                                                    <button 
                                                        onClick={() => handleLoadInvoice(inv)} 
                                                        className="px-2.5 py-1 bg-white hover:bg-indigo-50 hover:text-indigo-600 border border-slate-200 rounded-lg text-[10px] font-extrabold smooth-transition"
                                                    >
                                                        Buka
                                                    </button>
                                                    <button 
                                                        onClick={() => handleDeleteInvoice(inv.invoiceNumber)} 
                                                        className="p-1 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-lg smooth-transition"
                                                        title="Hapus"
                                                    >
                                                        <Icons.Trash />
                                                    </button>
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>

                            {/* Profil Toko Card */}
                            <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                                <h3 className="text-xs font-bold uppercase tracking-wider text-slate-400 mb-3 flex items-center gap-2">
                                    <span className="w-1.5 h-1.5 rounded-full" style={{ backgroundColor: themeColor }}></span>
                                    Profil Toko / Usaha Anda
                                </h3>
                                <div className="space-y-3">
                                    <div className="flex gap-3 items-center">
                                        <div onClick={() => fileInputRef.current?.click()} className="w-16 h-16 shrink-0 border-2 border-dashed border-slate-200 hover:border-indigo-500 bg-slate-50 rounded-xl flex flex-col items-center justify-center cursor-pointer overflow-hidden smooth-transition">
                                            {storeInfo.logo ? (
                                                <img src={storeInfo.logo} className="w-full h-full object-contain" alt="Logo" />
                                            ) : (
                                                <span className="text-[10px] font-bold text-slate-400">Pilih Logo</span>
                                            )}
                                        </div>
                                        <input type="file" ref={fileInputRef} className="hidden" accept="image/*" onChange={handleLogoUpload} />
                                        <div className="flex-grow">
                                            <label className="text-[10px] font-bold text-slate-400">Nama Toko/Usaha</label>
                                            <input type="text" value={storeInfo.name} onChange={(e) => setStoreInfo({ ...storeInfo, name: e.target.value })} className="w-full text-xs font-bold px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:bg-white focus:border-indigo-500 outline-none" placeholder="Nama Usaha" />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="text-[10px] font-bold text-slate-400">Alamat Lengkap</label>
                                        <textarea value={storeInfo.address} onChange={(e) => setStoreInfo({ ...storeInfo, address: e.target.value })} className="w-full text-xs px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:bg-white focus:border-indigo-500 outline-none h-16 resize-none" placeholder="Alamat Usaha"></textarea>
                                    </div>
                                    <div className="grid grid-cols-2 gap-2">
                                        <div>
                                            <label className="text-[10px] font-bold text-slate-400">No. HP/Telepon</label>
                                            <input type="text" value={storeInfo.phone} onChange={(e) => setStoreInfo({ ...storeInfo, phone: e.target.value })} className="w-full text-xs px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:bg-white focus:border-indigo-500 outline-none" placeholder="Kontak" />
                                        </div>
                                        <div>
                                            <label className="text-[10px] font-bold text-slate-400">Email Perusahaan</label>
                                            <input type="text" value={storeInfo.email} onChange={(e) => setStoreInfo({ ...storeInfo, email: e.target.value })} className="w-full text-xs px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:bg-white focus:border-indigo-500 outline-none" placeholder="Email" />
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* Detail Pelanggan Card */}
                            <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                                <h3 className="text-xs font-bold uppercase tracking-wider text-slate-400 mb-3 flex items-center gap-2">
                                    <span className="w-1.5 h-1.5 rounded-full" style={{ backgroundColor: themeColor }}></span>
                                    Informasi Pelanggan (Klien)

                                <div className="space-y-3">

                                        <label className="text-[10px] font-bold text-slate-400">Nama Pelanggan/Klien</label>
                                        <input type="text" value={customerInfo.name} onChange={(e) => setCustomerInfo({ ...customerInfo, name: e.target.value })} className="w-full text-xs font-bold px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:bg-white focus:border-indigo-500 outline-none" placeholder="Nama Pelanggan" />
                                    </div>
                                    <div>
                                        <label className="text-[10px] font-bold text-slate-400">Alamat Pelanggan</label>
                                        <textarea value={customerInfo.address} onChange={(e) => setCustomerInfo({ ...customerInfo, address: e.target.value })} className="w-full text-xs px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:bg-white focus:border-indigo-500 outline-none h-16 resize-none" placeholder="Alamat Pelanggan"></textarea>
