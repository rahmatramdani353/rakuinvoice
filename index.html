<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAKU Invoice Pro</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.263.1/dist/umd/lucide.js"></script>
    <!-- Library PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="bg-gray-100">
    <div id="root"></div>

    <script type="text/babel">
        // --- KONFIGURASI BACKEND ---
        const gasUrl = 'https://script.google.com/macros/s/AKfycbwYgHBKvA1Y-fKfn4RptmQN6ZfHEvX1P9_yDxFGAXt7Cj7fjL3sqo9JYNf3T13FDgiZ-A/exec'; // TEMPEL URL GOOGLE APPS SCRIPT KAMU DI SINI

        const { useState, useEffect, useRef } = React;
        const { FileText, Mail, Lock, User, Plus, Trash2, Printer, Settings, Image as ImageIcon, MessageCircle, Loader2, LogOut, FilePlus } = lucide;

        // --- Komponen Input Editable ---
        const EditableInput = ({ value, onChange, className = "", type = "text", multiline = false, placeholder = "" }) => {
            const baseClasses = "w-full bg-transparent border border-transparent hover:border-gray-300 focus:border-blue-500 focus:bg-blue-50 rounded px-1 outline-none transition-colors";
            if (multiline) return <textarea value={value} onChange={(e) => onChange(e.target.value)} placeholder={placeholder} className={`${baseClasses} ${className} resize-none`} />;
            return <input type={type} value={value} onChange={(e) => onChange(e.target.value)} placeholder={placeholder} className={`${baseClasses} ${className}`} />;
        };

        // --- Komponen Auth ---
        function AuthScreen({ onLogin }) {
            const [isLogin, setIsLogin] = useState(true);
            const [data, setData] = useState({ email: '', password: '', name: '' });
            const [loading, setLoading] = useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setLoading(true);
                if (!gasUrl) {
                    alert("Mode Demo: Berhasil masuk tanpa backend.");
                    onLogin({ name: 'User Demo' });
                    return;
                }
                try {
                    const res = await fetch(gasUrl, { method: 'POST', body: JSON.stringify({ ...data, action: isLogin ? 'login' : 'register' }) });
                    const resData = await res.json();
                    if (resData.status === 'success') onLogin(resData.user);
                    else alert(resData.message);
                } catch (err) { alert("Gagal terhubung ke server."); }
                setLoading(false);
            };

            return (
                <div className="min-h-screen flex items-center justify-center bg-gray-50 p-4">
                    <div className="bg-white p-8 rounded-2xl shadow-xl w-full max-w-sm">
                        <h2 className="text-2xl font-black mb-6 text-center">RAKU Invoice Pro</h2>
                        <form onSubmit={handleSubmit} className="space-y-4">
                            {!isLogin && <input type="text" placeholder="Nama" onChange={(e) => setData({...data, name: e.target.value})} className="w-full p-3 border rounded-lg" required />}
                            <input type="email" placeholder="Email" onChange={(e) => setData({...data, email: e.target.value})} className="w-full p-3 border rounded-lg" required />
                            <input type="password" placeholder="Password" onChange={(e) => setData({...data, password: e.target.value})} className="w-full p-3 border rounded-lg" required />
                            <button className="w-full bg-gray-900 text-white py-3 rounded-lg font-bold">{loading ? '...' : (isLogin ? 'Masuk' : 'Daftar')}</button>
                        </form>
                        <p className="text-center mt-4 text-sm cursor-pointer underline" onClick={() => setIsLogin(!isLogin)}>{isLogin ? 'Belum punya akun?' : 'Sudah punya akun?'}</p>
                    </div>
                </div>
            );
        }

        // --- Komponen Utama ---
        function App() {
            const [user, setUser] = useState(null);
            const [items, setItems] = useState([{ id: 1, name: 'Jasa', quantity: 1, price: 100000 }]);
            const [storeInfo, setStoreInfo] = useState({ name: 'RAKU Invoice Pro', address: 'Alamat Toko' });
            
            if (!user) return <AuthScreen onLogin={setUser} />;

            const handleDownload = () => {
                const element = document.getElementById('invoice');
                html2pdf().from(element).set({jsPDF: {orientation: 'landscape', format: 'a4'}}).save();
            };

            return (
                <div className="p-6 bg-gray-100 min-h-screen">
                    <div className="max-w-[297mm] mx-auto mb-4 flex justify-end gap-2">
                        <button onClick={handleDownload} className="bg-blue-600 text-white px-4 py-2 rounded-lg">Download PDF</button>
                        <button onClick={() => setUser(null)} className="bg-red-500 text-white px-4 py-2 rounded-lg">Keluar</button>
                    </div>
                    <div id="invoice" className="w-[297mm] h-[210mm] bg-white p-12 mx-auto shadow-lg">
                        <EditableInput value={storeInfo.name} onChange={(v) => setStoreInfo({...storeInfo, name: v})} className="text-4xl font-black" />
                        <table className="w-full mt-8 border-collapse">
                            <thead><tr className="border-b-2"><th className="text-left">Item</th><th>Qty</th><th>Harga</th></tr></thead>
                            <tbody>
                                {items.map(i => (
                                    <tr key={i.id} className="border-b">
                                        <td className="py-4"><EditableInput value={i.name} onChange={(v) => setItems(items.map(item => item.id === i.id ? {...item, name: v} : item))} multiline /></td>
                                        <td className="text-center"><EditableInput type="number" value={i.quantity} onChange={(v) => setItems(items.map(item => item.id === i.id ? {...item, quantity: v} : item))} /></td>
                                        <td className="text-right">Rp {i.price}</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
```

### Mengapa ini berhasil?
1. **Satu File:** Tidak ada file `jsx` yang butuh di-*build*. Semua kode React berada di dalam tag `<script type="text/babel">`.
2. **CDN:** Semua kebutuhan (React, Tailwind, html2pdf) diambil dari *Content Delivery Network* (server luar), sehingga kamu tidak perlu menginstall apa pun di komputermu.
3. **Kompatibilitas:** Jika kamu menyimpan file ini sebagai `index.html` dan membukanya di browser (atau menguploadnya ke Vercel), browser akan langsung menjalankan aplikasi tanpa menampilkan kode mentah.

**Tips:** Untuk Google Apps Script-mu, gunakan kode `doPost` yang sudah kita buat sebelumnya di langkah sebelumnya dan pastikan *Deployment* sudah di-update ke versi terbaru!
