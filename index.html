<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAKU Invoice Pro - Generator Invoice Profesional</title>
    <!-- Tailwind CSS untuk Desain Premium -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Google Font: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- React & Babel CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Library PDF HTML2PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        /* Gaya Cetak Khusus agar Presisi A4 Landscape */
        @media print {
            body {
                background: white;
                margin: 0;
                padding: 0;
            }
            .no-print {
                display: none !important;
            }
            .print-exact {
                box-shadow: none !important;
                border: none !important;
                padding: 0 !important;
                margin: 0 !important;
                width: 297mm !important;
                height: 210mm !important;
            }
        }
        .smooth-transition {
            transition: all 0.15s ease-in-out;
        }
        /* Sembunyikan spinner tombol input type number agar estetis */
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        // --- TEMPELKAN URL GOOGLE APPS SCRIPT WEB APP ANDA DI BAWAH INI ---
        const gasUrl = 'https://script.google.com/macros/s/AKfycbyFlQm1sk-y7Lsd8wE0kxlc5igT-Mckzf9qmUU63GrqHwLiQu2MjPWejqEv3niG9UxBRw/exec'; 

        // Custom SVG Icons (Sederhana dan kompatibel)
        const Icons = {
            Logo: () => <svg className="w-8 h-8 text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5"><path strokeLinecap="round" strokeLinejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>,
            User: () => <svg className="w-5 h-5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>,
            Lock: () => <svg className="w-5 h-5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg>,
            Mail: () => <svg className="w-5 h-5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>,
            Add: () => <svg className="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="3"><path strokeLinecap="round" strokeLinejoin="round" d="M12 4v16m8-8H4" /></svg>,
            Trash: () => <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>,
            Download: () => <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5"><path strokeLinecap="round" strokeLinejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>,
            WA: () => <svg className="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946C.06 5.348 5.397.01 12.008 0c3.202.001 6.212 1.247 8.477 3.514 2.266 2.268 3.507 5.28 3.505 8.484-.004 6.657-5.34 11.997-11.953 11.997-2.005-.001-3.973-.503-5.727-1.46L0 24zm6.59-4.846c1.6.95 3.188 1.449 4.825 1.451 5.436 0 9.86-4.37 9.864-9.799.002-2.63-1.023-5.101-2.885-6.963C16.528 2.025 14.072 1 11.516 1c-5.44 0-9.865 4.369-9.87 9.8a9.66 9.66 0 001.493 5.15l-.975 3.565 3.654-.947c1.644.897 3.253 1.362 4.729 1.362z" /></svg>,
            Logout: () => <svg className="w-5 h-5 text-rose-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>,
            New: () => <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M12 9v3m0 0v3m0-3h3m-3 0H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>,
            Save: () => <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5"><path strokeLinecap="round" strokeLinejoin="round" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4" /></svg>
        };

        const EditableInput = ({ value, onChange, className = "", type = "text", multiline = false, placeholder = "" }) => {
            const baseClasses = `w-full bg-transparent border border-transparent hover:border-slate-300 focus:border-indigo-500 focus:bg-indigo-50/50 rounded px-1.5 py-0.5 outline-none smooth-transition placeholder-slate-300 print:hidden [.pdf-mode_&]:hidden ${className}`;
            const displayClasses = `hidden print:block [.pdf-mode_&]:block whitespace-pre-wrap break-words w-full px-1.5 py-0.5 ${className}`;
            
            if (multiline) {
                return (
                    <div className="w-full relative">
                        <textarea
                            value={value}
                            onChange={(e) => {
                                e.target.style.height = 'auto';
                                e.target.style.height = e.target.scrollHeight + 'px';
                                onChange(e.target.value);
                            }}
                            ref={(el) => {
                                if (el) {
                                    el.style.height = 'auto';
                                    el.style.height = el.scrollHeight + 'px';
                                }
                            }}
                            placeholder={placeholder}
                            className={`${baseClasses} resize-none overflow-hidden`}
                        />
                        <div className={displayClasses}>
                            {value || <span className="text-slate-400 italic">{placeholder}</span>}
                        </div>
                    </div>
                );
            }
            
            return (
                <div className="w-full relative">
                    <input
                        type={type}
                        value={value}
                        onChange={(e) => onChange(e.target.value)}
                        placeholder={placeholder}
                        className={baseClasses}
                    />
                    <div className={displayClasses}>
                        {value || <span className="text-slate-400 italic">{placeholder}</span>}
                    </div>
                </div>
            );
        };

        function AuthScreen({ onLogin }) {
            const [isLogin, setIsLogin] = React.useState(true);
            const [email, setEmail] = React.useState('');
            const [password, setPassword] = React.useState('');
            const [name, setName] = React.useState('');
            const [loading, setLoading] = React.useState(false);
            const [message, setMessage] = React.useState({ type: '', text: '' });

            const handleSubmit = async (e) => {
                e.preventDefault();
                setLoading(true);
                setMessage({ type: '', text: '' });

                if (!gasUrl) {
                    // Mode Demo tanpa GAS URL
                    setTimeout(() => {
                        onLogin({ name: isLogin ? 'User Demo' : name, email: email }, "demo_token_12345");
                    }, 1000);
                    return;
                }

                try {
                    const response = await fetch(gasUrl, {
                        method: 'POST',
                        body: JSON.stringify({
                            action: isLogin ? 'login' : 'register',
                            email, password, name
                        })
                    });
                    const result = await response.json();
                    if (result.status === 'success') {
                        setMessage({ type: 'success', text: result.message });
                        setTimeout(() => onLogin(result.user, result.token, result.profile), 1500);
                    } else {
                        setMessage({ type: 'error', text: result.message });
                    }
                } catch (err) {
                    setMessage({ type: 'error', text: 'Gagal terhubung ke Database. Silakan cek ulang GAS URL atau jalankan offline.' });
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="min-h-screen flex items-center justify-center bg-slate-100 p-4">
                    <div className="bg-white p-8 rounded-3xl shadow-xl w-full max-w-md border border-slate-200/80 relative overflow-hidden">
                        <div className="absolute top-0 left-0 w-full h-2 bg-indigo-600"></div>
                        
                        <div className="text-center mb-8">
                            <div className="bg-indigo-50 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4 border border-indigo-100">
                                <Icons.Logo />
                            </div>
                            <h2 className="text-2xl font-black text-slate-900 tracking-tight">RAKU Invoice Pro</h2>
                            <p className="text-slate-500 text-sm mt-1">Sistem invoicing instan dengan cloud backend</p>
                        </div>

                        {message.text && (
                            <div className={`p-3 mb-4 rounded-xl text-xs font-semibold flex items-center gap-2 ${message.type === 'success' ? 'bg-emerald-50 text-emerald-700' : 'bg-rose-50 text-rose-700'}`}>
                                <div className="w-1.5 h-1.5 rounded-full bg-current"></div>
                                {message.text}
                            </div>
                        )}

                        <form onSubmit={handleSubmit} className="space-y-4">
                            {!isLogin && (
                                <div className="relative">
                                    <div className="absolute left-3.5 top-3.5"><Icons.User /></div>
                                    <input type="text" placeholder="Nama Lengkap" required value={name} onChange={(e) => setName(e.target.value)} className="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none text-sm focus:border-indigo-500 focus:bg-white transition-all placeholder-slate-400 font-medium" />
                                </div>
                            )}
                            <div className="relative">
                                <div className="absolute left-3.5 top-3.5"><Icons.Mail /></div>
                                <input type="email" placeholder="Alamat Email" required value={email} onChange={(e) => setEmail(e.target.value)} className="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none text-sm focus:border-indigo-500 focus:bg-white transition-all placeholder-slate-400 font-medium" />
                            </div>
                            <div className="relative">
                                <div className="absolute left-3.5 top-3.5"><Icons.Lock /></div>
                                <input type="password" placeholder="Kata Sandi" required value={password} onChange={(e) => setPassword(e.target.value)} className="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none text-sm focus:border-indigo-500 focus:bg-white transition-all placeholder-slate-400 font-medium" />
                            </div>

                            <button type="submit" disabled={loading} className="w-full bg-slate-900 text-white font-bold py-3 rounded-xl hover:bg-slate-800 transition-all flex items-center justify-center gap-2 shadow-lg shadow-slate-900/10">
                                {loading ? (
                                    <span className="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
                                ) : (
                                    isLogin ? 'Masuk Sekarang' : 'Daftar Akun Baru'
                                )}
                            </button>
                        </form>

                        <div className="mt-6 text-center">
                            <button onClick={() => { setIsLogin(!isLogin); setMessage({ type: '', text: '' }); }} className="text-sm font-semibold text-indigo-600 hover:text-indigo-800 transition-colors">
                                {isLogin ? 'Belum punya akun? Daftar gratis' : 'Sudah punya akun? Masuk'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function App() {
            const [user, setUser] = React.useState(null);
            const [token, setToken] = React.useState(null);
            const [checkingAuth, setCheckingAuth] = React.useState(true);

            // State Data Toko & Catatan Default (Gaya Clean-Slate untuk User Riil)
            const [storeInfo, setStoreInfo] = React.useState({
                name: '',
                address: '',
                phone: '',
                email: '',
                logo: ''
            });

            const [customerInfo, setCustomerInfo] = React.useState({ name: '', address: '', email: '', phone: '' });
            const [invoiceMeta, setInvoiceMeta] = React.useState({
                number: '',
                date: new Date().toISOString().split('T')[0],
                dueDate: new Date(new Date().setDate(new Date().getDate() + 14)).toISOString().split('T')[0]
            });

            // Default 1 baris kosong untuk user asli
            const [items, setItems] = React.useState([{ id: 1, name: '', quantity: 1, price: 0 }]);
            const [financials, setFinancials] = React.useState({ taxRate: 11, discount: 0 });
            const [notes, setNotes] = React.useState('');
            const [themeColor, setThemeColor] = React.useState('#4f46e5'); // Indigo Default

            // Status Operasional
            const [isGenerating, setIsGenerating] = React.useState(false);
            const [isSaving, setIsSaving] = React.useState(false);
            const [alertModal, setAlertModal] = React.useState({ show: false, message: '', type: 'success', onConfirm: null });

            const fileInputRef = React.useRef(null);

            // Auto-Verify Token saat Halaman Dimuat
            React.useEffect(() => {
                const autoLoginWithToken = async () => {
                    const savedToken = localStorage.getItem('raku_token');
                    const savedUser = localStorage.getItem('raku_user');

                    if (savedToken && savedUser) {
                        const parsedUser = JSON.parse(savedUser);
                        if (!gasUrl) {
                            // Offline demo mode bypass
                            setUser(parsedUser);
                            setToken(savedToken);
                            loadLocalDemoData();
                            setCheckingAuth(false);
                            return;
                        }

                        try {
                            const response = await fetch(gasUrl, {
                                method: 'POST',
                                body: JSON.stringify({ action: 'validateToken', token: savedToken })
                            });
                            const result = await response.json();
                            if (result.status === 'success') {
                                setUser(result.user);
                                setToken(savedToken);
                                
                                // Memuat profil dari database cloud secara instan
                                if (result.profile) {
                                    applyProfileData(result.profile);
                                } else {
                                    // Profil kosong, gunakan default kosong
                                    setItems([{ id: Date.now(), name: '', quantity: 1, price: 0 }]);
                                    generateNewInvoiceNum();
                                }
                            } else {
                                // Token kedaluwarsa / tidak valid
                                localStorage.removeItem('raku_token');
                                localStorage.removeItem('raku_user');
                            }
                        } catch (err) {
                            // Gagal terhubung, gunakan local cache sebagai fallback
                            setUser(parsedUser);
                            setToken(savedToken);
                            loadLocalDemoData();
                        }
                    }
                    setCheckingAuth(false);
                };

                autoLoginWithToken();
            }, []);

            // Mengisi data visual demo untuk mode demo/offline
            const loadLocalDemoData = () => {
                setStoreInfo({
                    name: 'RAKU Studio & Co.',
                    address: 'Grand Surapati Core Blok B-10, Bandung\nJawa Barat, Indonesia 40192',
                    phone: '+62 822-1234-5678',
                    email: 'finance@raku.co.id',
                    logo: ''
                });
                setCustomerInfo({
                    name: 'PT Sukses Bersama Mandiri',
                    address: 'Menara Sudirman Lantai 12, Jakarta Selatan',
                    email: 'info@suksesbersama.com',
                    phone: '0811999888'
                });
                setInvoiceMeta({
                    number: 'INV/' + new Date().getFullYear() + '/001',
                    date: new Date().toISOString().split('T')[0],
                    dueDate: new Date(new Date().setDate(new Date().getDate() + 14)).toISOString().split('T')[0]
                });
                setItems([
                    { id: 1, name: 'Analisa Bisnis & Perancangan System Flowchart', quantity: 1, price: 1200000 },
                    { id: 2, name: 'Pengembangan Desain UI/UX & Web Prototype Figma', quantity: 1, price: 2500000 },
                    { id: 3, name: 'Instalasi Framework Backend & Setup API Services', quantity: 1, price: 3000000 },
                    { id: 4, name: 'Slicing UI Frontend Component dengan Tailwind CSS', quantity: 1, price: 2000000 },
                    { id: 5, name: 'Integrasi Keamanan Otentikasi JWT & Role Base', quantity: 1, price: 1500000 }
                ]);
                setNotes('Transfer Pembayaran:\nBank Mandiri: 131-00-1234567-8\na.n. RAKU Studio & Co.');
            };

            const generateNewInvoiceNum = () => {
                setInvoiceMeta(prev => ({
                    ...prev,
                    number: 'INV/' + new Date().getFullYear() + '/' + String(Math.floor(Math.random() * 900) + 100)
                }));
            };

            const applyProfileData = (p) => {
                setStoreInfo({
                    name: p.name || '',
                    address: p.address || '',
                    phone: p.phone || '',
                    email: p.email || '',
                    logo: p.logo || ''
                });
                if (p.notes) setNotes(p.notes);
                if (p.themeColor) setThemeColor(p.themeColor);
                setItems([{ id: Date.now(), name: '', quantity: 1, price: 0 }]);
                generateNewInvoiceNum();
            };

            const handleLoginSuccess = (userData, userToken, profileData) => {
                setUser(userData);
                setToken(userToken);
                localStorage.setItem('raku_user', JSON.stringify(userData));
                localStorage.setItem('raku_token', userToken);

                if (profileData) {
                    applyProfileData(profileData);
                } else {
                    setItems([{ id: Date.now(), name: '', quantity: 1, price: 0 }]);
                    generateNewInvoiceNum();
                }
            };

            // Perhitungan Matematika Otomatis
            const subtotal = items.reduce((acc, item) => acc + (Number(item.quantity) || 0) * (Number(item.price) || 0), 0);
            const taxAmount = subtotal * ((Number(financials.taxRate) || 0) / 100);
            const total = subtotal + taxAmount - (Number(financials.discount) || 0);

            const formatIDR = (val) => {
                return new Intl.NumberFormat('id-ID', {
                    style: 'currency',
                    currency: 'IDR',
                    minimumFractionDigits: 0,
                    maximumFractionDigits: 0
                }).format(val);
            };

            const handleItemChange = (id, field, value) => {
                setItems(items.map(item => {
                    if (item.id === id) {
                        return { ...item, [field]: field === 'name' ? value : Number(value) };
                    }
                    return item;
                }));
            };

            const addNewItemRow = () => {
                if (items.length >= 20) {
                    showAlert('Demi kestabilan cetak 1 halaman A4, batas maksimal rincian adalah 20 baris.', 'error');
                    return;
                }
                setItems([...items, { id: Date.now(), name: '', quantity: 1, price: 0 }]);
            };

            const removeItemRow = (id) => {
                if (items.length > 1) {
                    setItems(items.filter(item => item.id !== id));
                } else {
                    showAlert('Minimal harus menyisakan satu rincian transaksi.', 'error');
                }
            };

            // Menghancurkan file logo ke resolusi rendah (agar muat di database GAS tanpa lemot)
            const handleLogoUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        const img = new Image();
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            const MAX_WIDTH = 150; // Menjaga payload super ringan (<10KB)
                            const scaleSize = MAX_WIDTH / img.width;
                            canvas.width = MAX_WIDTH;
                            canvas.height = img.height * scaleSize;
                            
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                            const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);
                            setStoreInfo(prev => ({ ...prev, logo: compressedBase64 }));
                        };
                        img.src = event.target.result;
                    };
                    reader.readAsDataURL(file);
                }
            };

            const handleSaveProfileCloud = async () => {
                setIsSaving(true);
                if (!gasUrl) {
                    showAlert('Anda sedang dalam Mode Offline. Silakan pasang GAS URL untuk menyimpan ke Cloud.', 'error');
                    setIsSaving(false);
                    return;
                }

                try {
                    const response = await fetch(gasUrl, {
                        method: 'POST',
                        body: JSON.stringify({
                            action: 'saveProfile',
                            token: token,
                            storeName: storeInfo.name,
                            address: storeInfo.address,
                            phone: storeInfo.phone,
                            storeEmail: storeInfo.email,
                            logo: storeInfo.logo,
                            themeColor: themeColor,
                            notes: notes
                        })
                    });
                    const result = await response.json();
                    if (result.status === 'success') {
                        showAlert('Profil Toko, Logo, Kontak, dan Setelan Rekening berhasil dicadangkan ke Database Cloud!', 'success');
                    } else {
                        showAlert('Gagal mencadangkan profil: ' + result.message, 'error');
                    }
                } catch (err) {
                    showAlert('Koneksi terputus. Pastikan konfigurasi internet Anda stabil.', 'error');
                } finally {
                    setIsSaving(false);
                }
            };

            // Pembuatan invoice baru secara bersih
            const triggerNewInvoice = () => {
                setAlertModal({
                    show: true,
                    type: 'confirm',
                    message: 'Ingin membuat invoice baru? Seluruh data rincian transaksi dan informasi klien saat ini akan dibersihkan.',
                    onConfirm: () => {
                        setCustomerInfo({ name: '', address: '', email: '', phone: '' });
                        setItems([{ id: Date.now(), name: '', quantity: 1, price: 0 }]);
                        generateNewInvoiceNum();
                        setFinancials({ taxRate: 11, discount: 0 });
                        setAlertModal({ show: false, message: '', type: 'success' });
                    }
                });
            };

            const showAlert = (msg, type = 'success', onConf = null) => {
                setAlertModal({ show: true, message: msg, type, onConfirm: onConf });
            };

            const handleDownloadPDF = () => {
                setIsGenerating(true);
                const element = document.getElementById('raku-invoice-document');
                
                element.classList.add('pdf-mode');

                const opt = {
                    filename: `${invoiceMeta.number.replace(/\//g, '-')}.pdf`,
                    image: { type: 'jpeg', quality: 0.98 },
                    html2canvas: { scale: 2, useCORS: true, letterRendering: true },
                    jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' }
                };

                html2pdf().set(opt).from(element).save().then(() => {
                    element.classList.remove('pdf-mode');
                    setIsGenerating(false);
                }).catch(() => {
                    element.classList.remove('pdf-mode');
                    setIsGenerating(false);
                    showAlert('Gagal mendownload PDF. Silakan ulangi.', 'error');
                });
            };

            const handleSendWhatsApp = () => {
                const text = `Halo *${customerInfo.name || 'Pelanggan'}*,\n\nBerikut ringkasan rincian invoice Anda dari *${storeInfo.name || 'Kami'}*:\n\n*No. Invoice:* ${invoiceMeta.number}\n*Tanggal:* ${invoiceMeta.date}\n*Total Tagihan:* ${formatIDR(total)}\n\nTerima kasih atas kepercayaan Anda.`;
                const link = `https://wa.me/${customerInfo.phone || ''}?text=${encodeURIComponent(text)}`;
                window.open(link, '_blank');
            };

            const handleLogout = () => {
                localStorage.removeItem('raku_token');
                localStorage.removeItem('raku_user');
                setUser(null);
                setToken(null);
            };

            if (checkingAuth) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center bg-slate-50">
                        <div className="w-10 h-10 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin mb-4"></div>
                        <p className="text-slate-600 font-bold text-sm">Menghubungkan Sesi Cloud...</p>
                    </div>
                );
            }

            if (!user) {
                return <AuthScreen onLogin={handleLoginSuccess} />;
            }

            return (
                <div className="p-4 md:p-6 flex flex-col justify-center items-center min-h-screen">
                    
                    {/* --- HEADER CONTROLS (Hidden in Print) --- */}
                    <div className="w-[297mm] mb-4 bg-white p-3 rounded-2xl shadow-md border border-slate-200/80 flex flex-wrap gap-4 items-center justify-between no-print">
                        <div className="flex items-center gap-3">
                            <div className="w-10 h-10 rounded-xl bg-indigo-50 border border-indigo-100 flex items-center justify-center">
                                <Icons.Logo />
                            </div>
                            <div>
                                <h1 className="font-extrabold text-slate-900 text-sm leading-tight">RAKU Invoice Pro</h1>
                                <p className="text-[10px] text-slate-500 font-semibold">User: {user.name} ({user.email})</p>
                            </div>
                        </div>

                        {/* Palet Aksen Warna Tema */}
                        <div className="flex items-center gap-2">
                            <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Aksen Warna:</span>
                            {['#4f46e5', '#0284c7', '#0d9488', '#e11d48', '#16a34a', '#1e293b'].map((color) => (
                                <button
                                    key={color}
                                    onClick={() => setThemeColor(color)}
                                    className={`w-4 h-4 rounded-full transition-transform ${themeColor === color ? 'scale-125 ring-2 ring-slate-300 ring-offset-2' : 'hover:scale-110'}`}
                                    style={{ backgroundColor: color }}
                                />
                            ))}
                        </div>

                        {/* Panel Aksi Cepat */}
                        <div className="flex items-center gap-1.5">
                            <button onClick={triggerNewInvoice} className="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold flex items-center gap-1.5 transition-all">
                                <Icons.New /> Invoice Baru
                            </button>
                            <button onClick={handleSaveProfileCloud} disabled={isSaving} className="px-3 py-1.5 bg-slate-800 hover:bg-slate-900 text-white rounded-xl text-xs font-bold flex items-center gap-1.5 transition-all shadow-sm">
                                {isSaving ? <span className="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span> : <Icons.Save />}
                                {isSaving ? 'Menyimpan...' : 'Simpan Profil'}
                            </button>
                            <button onClick={handleSendWhatsApp} className="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold flex items-center gap-1.5 transition-all shadow-md">
                                <Icons.WA /> Kirim WA
                            </button>
                            <button onClick={handleDownloadPDF} disabled={isGenerating} className="px-4 py-1.5 text-white rounded-xl text-xs font-bold flex items-center gap-2 transition-all shadow-md" style={{ backgroundColor: themeColor }}>
                                {isGenerating ? (
                                    <span className="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
                                ) : (
                                    <Icons.Download />
                                )}
                                {isGenerating ? 'Memproses...' : 'Download PDF'}
                            </button>
                            <button onClick={handleLogout} className="p-1.5 hover:bg-rose-50 rounded-xl transition-colors ml-1" title="Keluar">
                                <Icons.Logout />
                            </button>
                        </div>
                    </div>

                    {/* --- DOKUMEN INVOICE (A4 Landscape: 297mm x 210mm) --- */}
                    <div className="w-[297mm] h-[210mm] bg-white p-[6mm] shadow-2xl border border-slate-100 rounded-3xl print-exact relative box-border overflow-hidden select-none flex flex-col justify-between" id="raku-invoice-document">
                        
                        {/* 1. Header Invoice */}
                        <div className="flex justify-between items-start mb-2">
                            {/* Kiri: Profil Toko, Kontak, dan Logo */}
                            <div className="flex gap-3 w-[60%]">
                                <div onClick={() => fileInputRef.current?.click()} className="w-12 h-12 border border-dashed border-slate-200 hover:border-slate-400 bg-slate-50 hover:bg-slate-100 rounded-lg flex flex-col items-center justify-center cursor-pointer overflow-hidden transition-all print:border-none print:bg-transparent no-print">
                                    {storeInfo.logo ? (
                                        <img src={storeInfo.logo} className="w-full h-full object-contain" alt="Logo" />
                                    ) : (
                                        <div className="text-center p-1">
                                            <div className="mx-auto w-fit text-slate-400 text-xs"><Icons.Save /></div>
                                            <span className="text-[8px] font-bold text-slate-400 block mt-0.5">Logo</span>
                                        </div>
                                    )}
                                </div>
                                <input type="file" ref={fileInputRef} className="hidden" accept="image/*" onChange={handleLogoUpload} />
                                
                                <div className="flex-1">
                                    <EditableInput value={storeInfo.name} onChange={(v) => setStoreInfo({ ...storeInfo, name: v })} className="text-base font-extrabold text-slate-900 leading-tight" placeholder="Nama Usaha / Perusahaan Anda" />
                                    <EditableInput value={storeInfo.address} onChange={(v) => setStoreInfo({ ...storeInfo, address: v })} multiline className="text-[9px] text-slate-500 font-medium leading-tight mt-0.5" placeholder="Alamat Usaha Lengkap" />
                                    <div className="flex gap-4">
                                        <div className="w-1/2">
                                            <EditableInput value={storeInfo.phone} onChange={(v) => setStoreInfo({ ...storeInfo, phone: v })} className="text-[9px] text-slate-500 font-semibold" placeholder="No. Handphone Usaha" />
                                        </div>
                                        <div className="w-1/2">
                                            <EditableInput value={storeInfo.email} onChange={(v) => setStoreInfo({ ...storeInfo, email: v })} className="text-[9px] text-slate-500 font-semibold" placeholder="Email Perusahaan" />
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* Kanan: Nomor & Tanggal */}
                            <div className="w-[35%] text-right flex flex-col items-end">
                                <h2 className="text-xl font-black uppercase tracking-wider mb-1" style={{ color: themeColor }}>INVOICE</h2>
                                
                                <div className="w-full flex justify-end items-center gap-1.5 mb-0.5">
                                    <span className="text-[9px] font-bold text-slate-400 uppercase w-20 text-right">No:</span>
                                    <div className="w-28"><EditableInput value={invoiceMeta.number} onChange={(v) => setInvoiceMeta({ ...invoiceMeta, number: v })} className="text-[10px] font-bold text-slate-800 text-right" placeholder="No. Invoice" /></div>
                                </div>

                                <div className="w-full flex justify-end items-center gap-1.5 mb-0.5">
                                    <span className="text-[9px] font-bold text-slate-400 uppercase w-20 text-right">Tanggal:</span>
                                    <div className="w-28"><EditableInput type="date" value={invoiceMeta.date} onChange={(v) => setInvoiceMeta({ ...invoiceMeta, date: v })} className="text-[10px] font-semibold text-slate-800 text-right" /></div>
                                </div>

                                <div className="w-full flex justify-end items-center gap-1.5">
                                    <span className="text-[9px] font-bold text-slate-400 uppercase w-20 text-right">Jatuh Tempo:</span>
                                    <div className="w-28"><EditableInput type="date" value={invoiceMeta.dueDate} onChange={(v) => setInvoiceMeta({ ...invoiceMeta, dueDate: v })} className="text-[10px] font-semibold text-slate-800 text-right" /></div>
                                </div>
                            </div>
                        </div>

                        {/* 2. Detail Pelanggan */}
                        <div className="mb-1.5">
                            <h3 className="text-[8px] font-extrabold text-slate-400 uppercase tracking-widest border-b border-slate-100 pb-0.5 mb-0.5">Ditagihkan Kepada:</h3>
                            <div className="flex justify-between">
                                <div className="w-[50%]">
                                    <EditableInput value={customerInfo.name} onChange={(v) => setCustomerInfo({ ...customerInfo, name: v })} className="text-[10px] font-bold text-slate-800" placeholder="Nama Pelanggan / Perusahaan Klien" />
                                    <EditableInput value={customerInfo.address} onChange={(v) => setCustomerInfo({ ...customerInfo, address: v })} multiline className="text-[9px] text-slate-500 font-medium leading-tight mt-0.5" placeholder="Alamat Lengkap Pelanggan" />
                                </div>
                                <div className="w-[40%] text-right flex flex-col items-end">
                                    <div className="w-48"><EditableInput value={customerInfo.phone} onChange={(v) => setCustomerInfo({ ...customerInfo, phone: v })} className="text-[9px] text-slate-500 font-semibold text-right" placeholder="No. HP WhatsApp Klien" /></div>
                                    <div className="w-48"><EditableInput value={customerInfo.email} onChange={(v) => setCustomerInfo({ ...customerInfo, email: v })} className="text-[9px] text-slate-500 font-semibold text-right" placeholder="Email Klien" /></div>
                                </div>
                            </div>
                        </div>

                        {/* 3. Tabel Utama Rincian Transaksi */}
                        <div className="flex-grow overflow-y-hidden max-h-[105mm] border-t border-slate-100">
                            <table className="w-full text-left border-collapse">
                                <thead>
                                    <tr className="border-b" style={{ borderColor: themeColor }}>
                                        <th className="py-0.5 px-1 text-[9px] font-bold uppercase tracking-wider" style={{ color: themeColor }}>Deskripsi Rincian Pekerjaan / Jasa / Barang</th>
                                        <th className="py-0.5 px-1 text-[9px] font-bold uppercase tracking-wider text-center w-14" style={{ color: themeColor }}>Qty</th>
                                        <th className="py-0.5 px-1 text-[9px] font-bold uppercase tracking-wider text-right w-24" style={{ color: themeColor }}>Harga Satuan</th>
                                        <th className="py-0.5 px-1 text-[9px] font-bold uppercase tracking-wider text-right w-28" style={{ color: themeColor }}>Subtotal</th>
                                        <th className="w-5 py-0.5 text-center no-print"></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {items.map((item) => (
                                        <tr key={item.id} className="border-b border-slate-50 group hover:bg-slate-50/40">
                                            <td className="p-[1px] align-middle">
                                                <EditableInput value={item.name} onChange={(v) => handleItemChange(item.id, 'name', v)} placeholder="Ketik rincian barang/jasa..." className="text-[9px] font-medium text-slate-700 leading-none" />
                                            </td>
                                            <td className="p-[1px] align-middle text-center">
                                                <EditableInput type="number" value={item.quantity} onChange={(v) => handleItemChange(item.id, 'quantity', v)} className="text-[9px] font-semibold text-center text-slate-700" />
                                            </td>
                                            <td className="p-[1px] align-middle text-right">
                                                <EditableInput type="number" value={item.price} onChange={(v) => handleItemChange(item.id, 'price', v)} className="text-[9px] font-semibold text-right text-slate-700" />
                                            </td>
                                            <td className="p-[1px] align-middle text-right font-bold text-slate-800 text-[9px] pr-1">
                                                {formatIDR((item.quantity || 0) * (item.price || 0))}
                                            </td>
                                            <td className="p-[1px] align-middle text-center no-print">
                                                <button onClick={() => removeItemRow(item.id)} className="text-slate-300 hover:text-rose-600 transition-colors opacity-0 group-hover:opacity-100 smooth-transition" title="Hapus">
                                                    <Icons.Trash />
                                                </button>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                            
                            <button onClick={addNewItemRow} className="mt-1 text-[8px] font-bold text-slate-400 hover:text-slate-800 flex items-center gap-1 transition-colors no-print">
                                <Icons.Add /> Tambah Baris Transaksi
                            </button>
                        </div>

                        {/* 4. Footer & Blok Informasi */}
                        <div className="border-t border-slate-200 pt-1.5 mt-2 flex justify-between items-start h-[32mm] min-h-[32mm]">
                            {/* Catatan Pembayaran / Transfer */}
                            <div className="w-[35%] flex flex-col justify-between h-full">
                                <div>
                                    <p className="text-[8px] font-extrabold text-slate-400 uppercase tracking-widest border-b border-slate-100 pb-0.5 mb-1">Catatan & Pembayaran:</p>
                                    <div className="bg-slate-50/50 rounded-lg p-1.5 border border-slate-100">
                                        <EditableInput value={notes} onChange={setNotes} multiline={true} className="text-[8.5px] text-slate-600 italic font-medium leading-tight" placeholder="Instruksi pembayaran (cth: Rekening Bank Mandiri: xxxxxxx a.n Toko Anda)" />
                                    </div>
                                </div>
                            </div>

                            {/* Tanda Tangan Hormat Kami */}
                            <div className="w-[28%] flex flex-col justify-between items-center h-full text-center border-l border-r border-slate-100 px-2">
                                <p className="text-[9px] text-slate-500 font-semibold">Hormat Kami,</p>
                                <div className="w-full">
                                    <div className="border-b border-slate-300 w-[80%] mx-auto mb-1"></div>
                                    <p className="text-[9px] font-extrabold text-slate-800 truncate uppercase max-w-[170px] mx-auto">{storeInfo.name || 'Nama Perusahaan Anda'}</p>
                                </div>
                            </div>

                            {/* Kalkulasi Total Pajak & Diskon */}
                            <div className="w-[33%] flex flex-col justify-end h-full font-sans">
                                <div className="flex justify-between items-center text-[9px] mb-0.5">
                                    <span className="text-slate-500 font-medium">Subtotal</span>
                                    <span className="font-bold text-slate-700">{formatIDR(subtotal)}</span>
                                </div>

                                <div className="flex justify-between items-center text-[9px] mb-0.5">
                                    <div className="flex items-center gap-1">
                                        <span className="text-slate-500 font-medium">Pajak / PPN</span>
                                        <div className="flex items-center w-14 bg-slate-50 border border-slate-200 rounded px-1 py-0 print:border-none print:bg-transparent">
                                            <EditableInput type="number" value={financials.taxRate} onChange={(v) => setFinancials({ ...financials, taxRate: v })} className="text-[9px] text-right font-bold text-slate-700" />
                                            <span className="text-[9px] font-bold text-slate-400 ml-0.5">%</span>
                                        </div>
                                    </div>
                                    <span className="font-bold text-slate-700">{formatIDR(taxAmount)}</span>
                                </div>

                                <div className="flex justify-between items-center text-[9px] mb-1.5 pb-1 border-b border-slate-100">
                                    <span className="text-slate-500 font-medium">Diskon</span>
                                    <div className="flex items-center w-24">
                                        <span className="text-[9px] font-bold text-slate-400 mr-1">-Rp</span>
                                        <EditableInput type="number" value={financials.discount} onChange={(v) => setFinancials({ ...financials, discount: v })} className="text-[9px] text-right font-bold text-rose-600" />
                                    </div>
                                </div>

                                <div className="flex justify-between items-center p-1.5 rounded-xl" style={{ backgroundColor: `${themeColor}12` }}>
                                    <span className="text-[9px] font-black" style={{ color: themeColor }}>TOTAL TAGIHAN</span>
                                    <span className="text-xs font-black" style={{ color: themeColor }}>{formatIDR(total)}</span>
                                </div>
                            </div>
                        </div>

                    </div>

                    {/* --- MODAL DIALOG NOTIFIKASI CUSTOM (Elegant Popup) --- */}
                    {alertModal.show && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 no-print">
                            <div className="bg-white rounded-2xl max-w-sm w-full p-5 shadow-2xl border border-slate-100 text-center relative overflow-hidden">
                                <div className="absolute top-0 left-0 w-full h-1.5" style={{ backgroundColor: alertModal.type === 'error' ? '#f43f5e' : themeColor }}></div>
                                <h4 className="text-base font-black text-slate-900 mb-1">Notifikasi RAKU</h4>
                                <p className="text-xs text-slate-600 font-semibold leading-relaxed mb-5">{alertModal.message}</p>
                                
                                <div className="flex gap-3 justify-center">
                                    {alertModal.type === 'confirm' ? (
                                        <React.Fragment>
                                            <button onClick={() => setAlertModal({ show: false, message: '', type: 'success' })} className="px-4 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold transition-colors">
                                                Batal
                                            </button>
                                            <button onClick={alertModal.onConfirm} className="px-5 py-1.5 text-white rounded-xl text-xs font-bold transition-all shadow-md" style={{ backgroundColor: themeColor }}>
                                                Ya, Lanjutkan
                                            </button>
                                        </React.Fragment>
                                    ) : (
                                        <button onClick={() => setAlertModal({ show: false, message: '', type: 'success' })} className="px-6 py-1.5 text-white rounded-xl text-xs font-bold transition-all shadow-md" style={{ backgroundColor: themeColor }}>
                                            Oke
                                        </button>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        // Render Aplikasi ke DOM
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
